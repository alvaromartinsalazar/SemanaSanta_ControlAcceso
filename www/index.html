<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Control de acceso · Carrera Oficial</title>
<script src="jsQR.js"></script>
<script src="qrcode.js"></script>
<style>
:root{--bg:#faf7f2;--card:#fff;--tx:#241a2e;--mut:#7a6f85;--bd:#e4dcd0;--pri:#5b2a86;--ok:#1d7a3e;--okb:#d8f3e0;--ko:#b3261e;--kob:#fbdcd9;--wa:#9a5b00;--wab:#fdebc8;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1520;--card:#262030;--tx:#f1ecf6;--mut:#a79db3;--bd:#3b3347;--pri:#b98cf0;--ok:#6fdc97;--okb:#173a25;--ko:#ff8d85;--kob:#451b18;--wa:#ffc766;--wab:#44300a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1a1520;--card:#262030;--tx:#f1ecf6;--mut:#a79db3;--bd:#3b3347;--pri:#b98cf0;--ok:#6fdc97;--okb:#173a25;--ko:#ff8d85;--kob:#451b18;--wa:#ffc766;--wab:#44300a;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:12px}
h1{font:600 18px Georgia,serif;margin:4px 0 10px;color:var(--pri)}
nav{display:flex;gap:6px;margin-bottom:12px}
nav button{flex:1;padding:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font-weight:600}
nav button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
label{font-size:12px;color:var(--mut);display:block}
input,select{padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;width:100%}
.f{flex:1;min-width:110px}
button.b{padding:10px 14px;border:0;border-radius:10px;background:var(--pri);color:#fff;font-weight:600;font:inherit;font-weight:600}
button.s{background:var(--bd);color:var(--tx)}
.seg{display:flex;border-radius:10px;overflow:hidden;border:1px solid var(--pri)}
.seg button{flex:1;padding:12px;border:0;background:var(--card);color:var(--pri);font-weight:700;font-size:16px}
.seg button.on{background:var(--pri);color:#fff}
#res{border-radius:14px;padding:18px;text-align:center;margin:10px 0;min-height:130px;display:flex;flex-direction:column;justify-content:center;background:var(--bd)}
#res .big{font-size:28px;font-weight:800}
#res.ok{background:var(--okb);color:var(--ok)}#res.ko{background:var(--kob);color:var(--ko)}#res.wa{background:var(--wab);color:var(--wa)}
video{width:100%;max-height:260px;border-radius:12px;background:#000;display:none;object-fit:cover}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;text-align:center}
.kpi b{display:block;font-size:26px}.kpi span{font-size:12px;color:var(--mut)}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;margin:4px 0 10px}.bar i{display:block;height:100%;background:var(--pri)}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:5px 6px;border-bottom:1px solid var(--bd);text-align:left}
.tag{padding:2px 7px;border-radius:8px;font-size:11px;font-weight:700}
.t-DENTRO{background:var(--okb);color:var(--ok)}.t-FUERA{background:var(--wab);color:var(--wa)}.t-SIN_USAR{background:var(--bd);color:var(--mut)}
.scroll{overflow-x:auto;max-height:340px;overflow-y:auto}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tk{border:2px dashed var(--pri);border-radius:10px;padding:8px;text-align:center;font-size:12px;background:#fff;color:#241a2e}
.tk svg{width:100%;height:auto;max-width:120px}
.hide{display:none}
small{color:var(--mut)}
</style>
</head>
<body>
<div class="wrap">
<h1>✝ Carrera Oficial · Control de acceso</h1>
<nav><button data-t="puerta" class="on">Puerta</button><button data-t="panel">Panel</button><button data-t="cartones">Cartones</button></nav>

<section id="puerta">
 <div class="card">
  <div class="seg" id="modo"><button data-m="entrada" class="on">ENTRADA</button><button data-m="salida">SALIDA</button></div>
  <div class="row" style="margin-top:8px">
   <div class="f"><label>Puerta</label><input id="puertaN" value="Puerta 1"></div>
   <div class="f"><label>Operador</label><input id="oper" value="Operador 1"></div>
   <div class="f"><label>Jornada</label><select id="jornada"></select></div>
  </div>
 </div>
 <video id="vid" playsinline muted></video>
 <div id="res"><div class="big">Listo para escanear</div><small>Cámara, código manual o simulador</small></div>
 <div id="sup" class="hide row" style="margin-bottom:10px"><button class="b" id="force">Supervisor: forzar paso</button></div>
 <div class="card">
  <div class="row"><button class="b" id="cam">📷 Activar cámara</button><small id="camMsg"></small></div>
  <div class="row" style="margin-top:8px"><div class="f" style="flex:3"><input id="manual" placeholder="Pega o escribe el código v1.…"></div><button class="b s" id="go">Validar</button></div>
 </div>
</section>

<section id="panel" class="hide">
 <div class="kpis" id="kpis"></div>
 <div class="card" style="margin-top:12px"><b>Aforo por sector</b><div id="sectores" style="margin-top:8px"></div></div>
 <div class="card"><div class="row"><b style="flex:1">Últimos eventos</b><button class="b s" id="sim">Simular 200 pasos</button><button class="b s" id="reset">Reiniciar</button></div>
  <div class="scroll"><table><thead><tr><th>Hora</th><th>Cartón</th><th>Evento</th><th>Puerta</th><th>Nota</th></tr></thead><tbody id="log"></tbody></table></div></div>
</section>

<section id="cartones" class="hide">
 <div class="card">
  <div class="row">
   <div class="f"><label>Jornada</label><select id="gDia"></select></div>
   <div class="f"><label>Sector</label><select id="gSec"><option>A</option><option>B</option><option>C</option></select></div>
   <div class="f"><label>Filas</label><input id="gFil" type="number" value="3" min="1"></div>
   <div class="f"><label>Sillas/fila</label><input id="gSil" type="number" value="4" min="1"></div>
   <button class="b" id="gen">Generar</button>
  </div>
  <div style="margin-top:8px"><label>Clave secreta de firma (demo)</label><input id="secret"></div>
  <small>Cada cartón lleva QR con ID, jornada y firma HMAC-SHA256. Sin datos personales.</small>
 </div>
 <div id="lista"></div>
</section>
</div>

<script>
const DIAS={DR:"Domingo de Ramos",LU:"Lunes Santo",MA:"Martes Santo",MI:"Miércoles Santo",JU:"Jueves Santo",MD:"Madrugá",VI:"Viernes Santo",SA:"Sábado Santo",DO:"Domingo de Resurrección"};
let S={secret:"sevilla-demo-2026",cartones:{},eventos:[],jornada:"MA"};
let modo="entrada",ultimo=null,stream=null,lastScan={c:"",t:0};
const $=id=>document.getElementById(id);
function load(){try{const j=localStorage.getItem("ca-v1");if(j)S=Object.assign(S,JSON.parse(j))}catch(e){}}
function save(){try{localStorage.setItem("ca-v1",JSON.stringify(S))}catch(e){}}
async function sig(id,dia){const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(S.secret),{name:"HMAC",hash:"SHA-256"},false,["sign"]);
 const b=await crypto.subtle.sign("HMAC",k,new TextEncoder().encode(id+"."+dia));return[...new Uint8Array(b)].slice(0,4).map(x=>x.toString(16).padStart(2,"0")).join("")}
const hora=t=>new Date(t).toLocaleTimeString("es-ES");
function fill(sel){sel.innerHTML=Object.entries(DIAS).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}

/* ---------- Núcleo de validación ---------- */
function ev(id,tipo,nota){S.eventos.unshift({t:Date.now(),id,tipo,puerta:$("puertaN").value,op:$("oper").value,nota:nota||""});if(S.eventos.length>3000)S.eventos.length=3000}
async function procesar(code,opts={}){
 code=(code||"").trim();const p=code.split(".");
 if(p.length!==4||p[0]!=="v1")return r("ko","QR NO VÁLIDO","Formato desconocido");
 const[,id,dia,fm]=p;
 if(await sig(id,dia)!==fm){ev(id,"rechazo","firma inválida");return r("ko","FALSIFICADO","Firma incorrecta")}
 if(dia!==$("jornada").value)return rer(id,"OTRO DÍA","Válido para: "+DIAS[dia]);
 const c=S.cartones[id];
 if(!c)return rer(id,"NO CONSTA","Cartón no cargado en este lector");
 if(c.anulado)return rer(id,"ANULADO","Cartón dado de baja");
 const info=`Sector ${c.sector} · Fila ${c.fila} · Silla ${c.silla}`;
 ultimo={id,info};
 if(modo==="entrada"){
  if(c.estado==="DENTRO"&&!opts.force){ev(id,"rechazo","ya dentro");save();$("sup").classList.remove("hide");return r("ko","YA ESTÁ DENTRO",info+" · posible copia")}
  const nota=opts.force?"forzado por supervisor":(c.estado==="SIN_USAR"?"primera entrada":"reentrada");
  c.estado="DENTRO";ev(id,opts.force?"override":"entrada",nota);save();return r("ok","ADELANTE",info)
 }
 const anom=c.estado!=="DENTRO";
 c.estado="FUERA";ev(id,"salida",anom?"anomalía: salida sin entrada":"");save();
 return r(anom?"wa":"ok",anom?"SALIDA (anomalía)":"SALIDA OK",info)}
function rer(id,t,m){ev(id,"rechazo",t);save();return r("ko",t,m)}
function r(cls,t,m){$("res").className=cls;$("res").innerHTML=`<div class="big">${t}</div><div>${m}</div>`;
 if(cls!=="ko")$("sup").classList.add("hide");beep(cls);if(navigator.vibrate)navigator.vibrate(cls==="ko"?[200,80,200]:60);render();return cls}
function beep(c){try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=c==="ko"?180:c==="wa"?440:880;g.gain.value=.08;o.start();o.stop(a.currentTime+(c==="ko"?.4:.12))}catch(e){}}

/* ---------- Cámara ---------- */
$("cam").onclick=async()=>{
 if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;$("vid").style.display="none";$("cam").textContent="📷 Activar cámara";return}
 try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});
  const v=$("vid");v.srcObject=stream;v.style.display="block";await v.play();$("cam").textContent="Apagar cámara";$("camMsg").textContent="";tick()}
 catch(e){$("camMsg").textContent="Cámara no disponible aquí; usa código manual o el simulador."}}
function tick(){if(!stream)return;const v=$("vid");
 if(v.readyState===4){const c=document.createElement("canvas");c.width=v.videoWidth;c.height=v.videoHeight;const x=c.getContext("2d");x.drawImage(v,0,0);
  const d=x.getImageData(0,0,c.width,c.height),q=jsQR(d.data,d.width,d.height);
  if(q&&q.data&&(q.data!==lastScan.c||Date.now()-lastScan.t>2500)){lastScan={c:q.data,t:Date.now()};procesar(q.data)}}
 requestAnimationFrame(tick)}
$("go").onclick=()=>{procesar($("manual").value);$("manual").value=""};
$("manual").onkeydown=e=>{if(e.key==="Enter")$("go").click()};
$("force").onclick=()=>{if(ultimo&&confirm("¿Forzar entrada de "+ultimo.id+"? Quedará registrado."))procesar(ultimo.code,{force:true})};
document.querySelectorAll("#modo button").forEach(b=>b.onclick=()=>{modo=b.dataset.m;document.querySelectorAll("#modo button").forEach(x=>x.classList.toggle("on",x===b))});

/* ---------- Generador ---------- */
$("gen").onclick=async()=>{
 S.secret=$("secret").value||S.secret;const dia=$("gDia").value,sec=$("gSec").value,F=+$("gFil").value,N=+$("gSil").value;
 let n=Object.keys(S.cartones).filter(k=>k[0]===sec).length;
 for(let f=1;f<=F;f++)for(let s=1;s<=N;s++){n++;const id=sec+String(n).padStart(4,"0");
  const code=`v1.${id}.${dia}.${await sig(id,dia)}`;S.cartones[id]={id,dia,sector:sec,fila:f,silla:s,estado:"SIN_USAR",anulado:false,code}}
 save();render()};
function qrSvg(t){const q=qrcode(0,"M");q.addData(t);q.make();return q.createSvgTag(3,0)}
window.scan=id=>{const c=S.cartones[id];ultimo={id};ultimo.code=c.code;procesar(c.code)};
window.anular=id=>{S.cartones[id].anulado=!S.cartones[id].anulado;save();render()};

/* ---------- Simulador ---------- */
$("sim").onclick=async()=>{const ids=Object.keys(S.cartones).filter(i=>S.cartones[i].dia===$("jornada").value);
 if(!ids.length)return alert("Genera cartones para la jornada seleccionada.");
 const m=modo,b=beep;beep=()=>{};
 for(let i=0;i<200;i++){const c=S.cartones[ids[Math.random()*ids.length|0]];modo=c.estado==="DENTRO"&&Math.random()<.5?"salida":"entrada";await procesar(c.code)}
 modo=m;beep=b;render()};
$("reset").onclick=()=>{if(confirm("¿Borrar todos los datos?")){S.cartones={};S.eventos=[];save();render()}};

/* ---------- Render ---------- */
function render(){
 const cs=Object.values(S.cartones),dentro=cs.filter(c=>c.estado==="DENTRO").length;
 const hoy=S.eventos,rech=hoy.filter(e=>e.tipo==="rechazo").length,anom=hoy.filter(e=>/anomal|forzado/.test(e.nota)).length;
 $("kpis").innerHTML=[["Cartones",cs.length],["Dentro ahora",dentro],["Fuera",cs.filter(c=>c.estado==="FUERA").length],["Sin usar",cs.filter(c=>c.estado==="SIN_USAR").length],["Rechazos",rech],["Anomalías",anom]].map(([a,b])=>`<div class="kpi"><b>${b}</b><span>${a}</span></div>`).join("");
 const secs=[...new Set(cs.map(c=>c.sector))].sort();
 $("sectores").innerHTML=secs.length?secs.map(s=>{const t=cs.filter(c=>c.sector===s),d=t.filter(c=>c.estado==="DENTRO").length;
  return`<div><b>Sector ${s}</b> <small>${d} / ${t.length}</small><div class="bar"><i style="width:${t.length?d/t.length*100:0}%"></i></div></div>`}).join(""):"<small>Sin datos todavía</small>";
 $("log").innerHTML=hoy.slice(0,60).map(e=>`<tr><td>${hora(e.t)}</td><td>${e.id}</td><td>${e.tipo}</td><td>${e.puerta}</td><td>${e.nota}</td></tr>`).join("");
 $("lista").innerHTML=cs.length?`<div class="card"><div class="scroll"><table><thead><tr><th>ID</th><th>Día</th><th>Sitio</th><th>Estado</th><th></th></tr></thead><tbody>`+
  cs.slice(-150).reverse().map(c=>`<tr><td>${c.id}</td><td>${c.dia}</td><td>${c.sector}-${c.fila}-${c.silla}</td><td><span class="tag t-${c.estado}">${c.anulado?"ANULADO":c.estado}</span></td><td><button class="b s" onclick="scan('${c.id}')">Escanear</button> <button class="b s" onclick="anular('${c.id}')">${c.anulado?"Reactivar":"Anular"}</button></td></tr>`).join("")+
  `</tbody></table></div></div><div class="cards">`+cs.slice(-12).reverse().map(c=>`<div class="tk">${qrSvg(c.code)}<div><b>${c.id}</b></div><div>${DIAS[c.dia]}<br>${c.sector} · F${c.fila} · S${c.silla}</div></div>`).join("")+`</div>`:"<small>Genera cartones para empezar.</small>"}

document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x===b));
 ["puerta","panel","cartones"].forEach(t=>$(t).classList.toggle("hide",t!==b.dataset.t))});
load();fill($("jornada"));fill($("gDia"));$("jornada").value=S.jornada;$("gDia").value=S.jornada;$("secret").value=S.secret;
$("jornada").onchange=()=>{S.jornada=$("jornada").value;save()};render();
</script>
</body>
</html>
